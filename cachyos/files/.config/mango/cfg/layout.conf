# | Layout |
# layouts | https://mangowm.github.io/docs/window-management/layouts

# Number of workspaces (tags). Default 9, max 31.
tag_num = 5

# Wrap workspace switching around at the ends (SUPER+CTRL+h/l /
# viewtoleft/viewtoright): tag 5 -> 1 going right, tag 1 -> 5 going left.
# Default 0 (clamps at the ends instead of cycling).
tag_carousel = 1

# Change your layout here for each workspace. Applies to every monitor
# (no monitor_name given), same as before.
# tile, scroller, grid, deck, monocle, center_tile, vertical_tile, right_tile, vertical_scroller, dwindle, fair, vertical_fair, vertical_grid, vertical_deck
tagrule = id:1, layout_name:scroller
tagrule = id:2, layout_name:scroller
tagrule = id:3, layout_name:scroller
tagrule = id:4, layout_name:scroller
tagrule = id:5, layout_name:fair

# SUPER+N (already bound) cycles through this list on the current tag, for
# trying out layouts live before settling on one.
circle_layout = dwindle,tile,scroller,vertical_scroller

# Scrolling layout settings
scroller_structs = 40
scroller_default_proportion = 0.5
scroller_focus_center = 0
scroller_prefer_center = 0
scroller_prefer_overspread = 1
edge_scroller_pointer_focus = 1
scroller_default_proportion_single = 2.0
scroller_proportion_preset = 0.5, 0.8, 1.0

# Master-Stack layout settings
new_is_master = 1
default_mfact = 0.55
default_nmaster = 1
smartgaps = 0
