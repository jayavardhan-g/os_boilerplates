# | Look & Feel |
# theming | https://mangowm.github.io/docs/visuals

gappih = 1
gappiv = 1
gappoh = 3
gappov = 3
# Special tag (tag 0 / SUPER+S scratchpad) has its own separate gap settings
# in mangowm 0.17.0+ - defaulted to 10/10/20/20 since our config predates
# this option, causing the special-tag window to sit with a huge margin
# unrelated to the normal gaps above. Matched to the same values as above.
special_gappih = 1
special_gappiv = 1
special_gappoh = 3
special_gappov = 3
borderpx = 2
border_radius = 10

# Mango's real compiled-in default is 1.0 (fully opaque) for both
# focused_opacity and unfocused_opacity - confirmed in source
# (parse_config.c ~3986). Earlier attempts to set this appeared to do
# nothing because client.c (~1909-1910) only copies config.unfocused_opacity
# into a window at CREATION time - reload_config (SUPER+F5) re-parses the
# file but never re-applies opacity to windows already open, only to ones
# opened afterward. Test any new value on a freshly-opened window, not an
# existing one.
unfocused_opacity = 0.80
focused_opacity = 0.90

scratchpad_width_ratio = 1.0
scratchpad_height_ratio = 1.0

rootcolor = 0x201b14ff
bordercolor = 0x444444ff
# Mango has no gradient-border support at all (confirmed: no "gradient" in
# Mango's source or binary) - this is a flat-color approximation of
# Hyprland's active_border gradient (CACHYLGREEN -> CACHYDGREEN, 45deg, see
# ~/.config/hypr/config/decorations.lua), using the brighter of the two
# stops since a single flat color can't represent a gradient.
focuscolor = 0x82dcccff
maximizescreencolor = 0x47add6ff
urgentcolor = 0xad401fff
scratchpadcolor = 0x47add6ff
globalcolor = 0xb153a7ff
overlaycolor = 0x14a57cff

# Matched to Hyprland's actual cursor (set in ~/.config/uwsm/env via
# XCURSOR_THEME/HYPRCURSOR_THEME, also mirrored in gtk-3.0/settings.ini) -
# mango's stock default here was capitaine-cursors, unrelated to Hyprland.
cursor_theme = Bibata-Modern-Ice
cursor_size = 24

blur = 1
blur_layer = 0
blur_optimized = 0
# num_passes/radius/brightness/contrast/noise mirror Hyprland's real live
# defaults (queried via hyprctl getoption while logged into Hyprland,
# since decorations.lua never overrides them itself):
# decoration:blur:passes=4, size=5, brightness=1.0, contrast=0.8916,
# noise=0.0117.
blur_params_num_passes = 4
blur_params_radius = 5
blur_params_noise = 0.0117
blur_params_brightness = 1.0
blur_params_contrast = 0.8916
# No true Hyprland equivalent to mirror here: Hyprland uses a different
# "vibrancy" algorithm (decoration:blur:vibrancy, default 0.1696) instead
# of a flat saturation multiplier, on a different scale entirely (0 = no
# effect there, vs 1.0 = no effect here) - left neutral rather than
# guessing a translated number. Confirmed this key is live (not dead
# config) by briefly setting it to 0 and seeing the blurred backdrop
# render in grayscale.
blur_params_saturation = 1.0

shadows = 1
layer_shadows = 0
shadow_only_floating = 0
shadows_size = 4
shadows_blur = 5
shadows_position_x = 0
shadows_position_y = 0
shadowscolor = 0x000000ff

animations = 1
layer_animations = 1
animation_type_open = zoom
animation_type_close = zoom
animation_fade_in = 1
animation_fade_out = 1
tag_animation_direction = 1
zoom_initial_ratio = 0.1
zoom_end_ratio = 0.5
fadein_begin_opacity = 0.3
fadeout_begin_opacity = 0.2
animation_duration_move = 300
animation_duration_open = 100
animation_duration_tag = 300
animation_duration_close = 400
animation_duration_focus = 0
animation_curve_open = 0.87, 0, 0.13, 1
animation_curve_move = 0.46, 1.0, 0.29, 1
animation_curve_tag = 0.46, 1.0, 0.29, 1
animation_curve_close = 0.87, 0, 0.13, 1
animation_curve_focus = 0.46, 1.0, 0.29, 1
animation_curve_opafadeout = 0.5, 0.5, 0.5, 0.5
animation_curve_opafadein = 0.46, 1.0, 0.29, 1
