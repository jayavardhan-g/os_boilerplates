# | Miscellaneous |
# https://mangowm.github.io/docs/configuration/miscellaneous

allow_tearing = 2
syncobj_enable = 1
# xwayland-persistence = 1

drag_tile_to_tile = 1

# Focus movement (hjkl/arrows) no longer crosses monitors - was confusing
# `SUPER+j`/`k` landing on the external monitor once tag 1 switched to
# vertical_scroller (see [[known-bugs]] for why this is a global flag with
# no per-direction control). Explicit monitor switching is `SUPER+[`/`]`
# instead (see [[multi-monitor-setup]]), so this isn't a loss of capability,
# just makes hjkl monitor-local only.
focus_cross_monitor = 0

# Focus follows mouse (dwm-family default is on): just moving the pointer
# over another window would steal focus to it. Click-to-focus instead.
sloppyfocus = 0

# Hot corner: push the cursor into a screen corner to trigger overview
# (like GNOME's hot corner). hotarea_size is the corner trigger zone in px;
# hotarea_disable_on_fullscreen keeps a fullscreen video/game from
# triggering it accidentally.
enable_hotarea = 1
hotarea_size = 10
hotarea_disable_on_fullscreen = 1

# Windows-style edge/corner snap zones for floating windows (drag near a
# screen edge to snap-resize into a half/corner).
enable_floating_snap = 1
snap_distance = 30
