# | Keybinds |
# Configure your keybinds here. | https://mangowm.github.io/docs/bindings/keys

# Your favorite applications.
bind = SUPER, Return, spawn, kitty 
bind = SUPER, e, spawn, dolphin
bind = SUPER, b, spawn, app.zen_browser.zen

# Please choose the text editor of your choice.
# bind = SUPER, x, spawn, zed

bind = SUPER, q, killclient,

# Noctalia specific keybinds.
bind = SUPER, space, spawn, noctalia msg panel-toggle launcher
bind = SUPER, x, spawn, noctalia msg panel-toggle control-center
bind = SUPER, w, spawn, noctalia msg panel-toggle noctalia/wallhaven:browser
bind = SUPER, v, spawn, noctalia msg panel-toggle clipboard
bind = SUPER+SHIFT, q, spawn, noctalia msg panel-toggle session

# Windows-style display mode menu: Extend/PC-only/Second-only (matches
# Hyprland's SUPER+P). No "Duplicate" option - Mango has no mirror dispatch.
# Region screenshot moved off SUPER+P since Print/F6 already cover it.
bind = SUPER, p, spawn, /home/jayavardhan/.config/mango/scripts/display-mode.sh

# Screenshots
bind = SUPER+SHIFT, p, spawn, noctalia msg screenshot-fullscreen
bind = SUPER+ALT, p, spawn, noctalia msg screenshot-fullscreen all
# Physical Print key -> full screen (matches Hyprland).
# NOTE: uses `bindr` (release-triggered), not plain `bind` - confirmed via
# wev that this key's firmware only ever sends a release event, never a
# press, so a normal press-triggered bind can never match.
bindr = NONE, Print, spawn, noctalia msg screenshot-fullscreen
# Fn+F6 -> cropped/region screenshot (confirmed via wev: sends plain F6).
# Re-enabled: proven NOT responsible for the special-tag toggle some testing
# showed - that was actually SUPER+SHIFT+S being pressed, confirmed via a
# wev capture that showed real S/Super/Shift keycodes, not F6, during that
# specific test.
bind = NONE, F6, spawn, noctalia msg screenshot-region

# Reload config (moved off SUPER+R, which now enters resize mode below)
bind = SUPER, F5, reload_config

# Enter resize mode (see the `keymode=resize` block at the end of this file)
bind = SUPER, r, setkeymode, resize

# Audio controls
bind = NONE, XF86AudioRaiseVolume, spawn, noctalia msg volume-up
bind = NONE, XF86AudioLowerVolume, spawn, noctalia msg volume-down
bind = NONE, XF86AudioMute, spawn, noctalia msg volume-mute

# Brightness controls
bind = NONE, XF86MonBrightnessUp, spawn, noctalia msg brightness-up
bind = NONE, XF86MonBrightnessDown, spawn, noctalia msg brightness-down

# Switch window focus
bind = SUPER, Tab, focusstack, next
bind = SUPER, Left, focusdir, left
bind = SUPER, Right, focusdir, right
bind = SUPER, Up, focusdir, up
bind = SUPER, Down, focusdir, down
# vim-style focus movement
bind = SUPER, h, focusdir, left
bind = SUPER, l, focusdir, right
bind = SUPER, k, focusdir, up
bind = SUPER, j, focusdir, down

# Swap window
bind = SUPER+SHIFT, Up, exchange_client, up
bind = SUPER+SHIFT, Down, exchange_client, down
bind = SUPER+SHIFT, Left, exchange_client, left
bind = SUPER+SHIFT, Right, exchange_client, right
# vim-style window swap
bind = SUPER+SHIFT, h, exchange_client, left
bind = SUPER+SHIFT, l, exchange_client, right
bind = SUPER+SHIFT, k, exchange_client, up
bind = SUPER+SHIFT, j, exchange_client, down

# Master swap (matches Hyprland's SUPER+M swapwithmaster). `zoom` moves the
# focused window to the front of the client list - dwm's classic master-
# swap action, most meaningful on the "tile" master-stack layout, same as
# how SUPER+M is inert under Hyprland's non-master layouts.
bind = SUPER, m, zoom,

# Switch window status
bind = SUPER, g, toggleglobal,
bind = ALT, Tab, toggleoverview,
bind = SUPER+SHIFT, f, togglefloating,
bind = SUPER, f, togglefullscreen,
bind = SUPER, d, togglemaximizescreen,
bind = SUPER+ALT, f, togglefakefullscreen,
bind = SUPER, i, minimized,
bind = SUPER, o, toggleoverlay,
bind = SUPER+SHIFT, I, restore_minimized
# Minimize-pile scratchpad (different from the special-tag scratchpad below) -
# demoted off SUPER+Z since Z now matches Hyprland's settings-toggle key.
bind = ALT, z, toggle_scratchpad

# Special-tag scratchpad, matching Hyprland's SUPER+S / SUPER+SHIFT+S exactly.
# Confirmed real (present in mangowm 0.17.0+, upgraded via AUR specifically
# for this) via `strings /usr/bin/mango` and the actual source in
# src/dispatch/bind.c - toggle_special_tag shows/hides the whole tag-0
# overlay, tag_special_tag smart-toggles the focused window in/out of it.
bind = SUPER, s, toggle_special_tag,
bind = SUPER+SHIFT, s, tag_special_tag,

# Noctalia settings panel (moved here to match Hyprland's SUPER+Z)
bind = SUPER, z, spawn, noctalia msg settings-toggle

# Scroller layout - demoted off SUPER+X since X now matches Hyprland's
# control-center key.
bind = SUPER+SHIFT, e, set_proportion, 1.0
bind = ALT, x, switch_proportion_preset,

# Switch layout - persists the result into layout.conf's tagrule so it
# survives a restart, instead of only lasting for the session (see
# switch-layout-persist.sh)
bind = SUPER, n, spawn, /home/jayavardhan/.config/mango/scripts/switch-layout-persist.sh

# Relative workspace switching (previous/next)
bind = SUPER+CTRL, h, viewtoleft, 0
bind = SUPER+CTRL, l, viewtoright, 0
# arrow-key versions too (matches Hyprland's SUPER+CTRL+Right/Left)
bind = SUPER+CTRL, Left, viewtoleft, 0
bind = SUPER+CTRL, Right, viewtoright, 0

# Switch between workspaces (back to bare digits - monitor switching moved
# to bracket keys below instead of taking over these)
bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, 5, view, 5, 0

# Tag: move client to another workspace.
# Tagsilent: move client to another workspace but do not focus it.
# E.g bind = SUPER+SHIFT, 1, tagsilent, 1
bind = SUPER+SHIFT ,1, tag, 1, 0
bind = SUPER+SHIFT, 2, tag, 2, 0
bind = SUPER+SHIFT, 3, tag, 3, 0
bind = SUPER+SHIFT, 4, tag, 4, 0
bind = SUPER+SHIFT, 5, tag, 5, 0

# Switch between monitors - bracketleft/right ([ left = laptop, ] right =
# monitor, matches the physical eDP-1/HDMI-A-1 left-right arrangement) and
# by direction (kept as an alternative)
bind = SUPER, bracketleft, focusmon, eDP-1
bind = SUPER, bracketright, focusmon, HDMI-A-1
bind = SUPER+ALT, Left, focusmon, left
bind = SUPER+ALT, Right, focusmon, right
# Move window to another monitor - lands on whichever tag the destination
# monitor is currently showing (confirmed via source,
# client_reset_mon_tags) - bracket keys and by direction as an alternative
bind = SUPER+SHIFT, bracketleft, tagmon, eDP-1
bind = SUPER+SHIFT, bracketright, tagmon, HDMI-A-1
bind = SUPER+SHIFT+ALT, Left, tagmon, left
bind = SUPER+SHIFT+ALT, Right, tagmon, right

# Gaps
bind = SUPER+SHIFT, X, incgaps, 1
bind = SUPER+SHIFT, Z, incgaps, -1
bind = SUPER+SHIFT, R, togglegaps

# Movewin
bind = CTRL+SHIFT, Up, movewin, +0, -50
bind = CTRL+SHIFT, Down, movewin, +0, +50
bind = CTRL+SHIFT, Left, movewin, -50,+0
bind = CTRL+SHIFT, Right, movewin, +50,+0

# Resizewin
bind = CTRL+ALT, Up, resizewin, +0, -50
bind = CTRL+ALT, Down, resizewin, +0, +50
bind = CTRL+ALT, Left, resizewin, -50, +0
bind = CTRL+ALT, Right, resizewin, +50, +0

# Mouse Button Bindings.
# btn_left and btn_right can't bind none mod key
mousebind = SUPER, btn_left, moveresize,curmove
mousebind = SUPER, btn_right, moveresize, curresize
# Removed: mousebind = NONE, btn_middle, togglemaximizescreen, 0
# Bare (unmodified) middle-click was globally intercepted for
# togglemaximizescreen, stealing it from apps (e.g. browser middle-click
# paste/open-link-in-tab/close-tab). SUPER+D already does the same toggle
# via keyboard, so no functionality is lost by dropping the mouse duplicate.

# Resize mode: SUPER+R (above) enters this mode; hjkl/arrows resize the
# focused window; Escape or SUPER+R again exits back to normal binds.
# NOTE: everything below `keymode=resize` belongs to that mode until the
# next `keymode=` line — this block must stay LAST in the file, or any
# binds placed after it would silently become resize-only too.
keymode=resize
bind = NONE, h, resizewin, -40, +0
bind = NONE, l, resizewin, +40, +0
bind = NONE, k, resizewin, +0, -40
bind = NONE, j, resizewin, +0, +40
bind = NONE, Left, resizewin, -40, +0
bind = NONE, Right, resizewin, +40, +0
bind = NONE, Up, resizewin, +0, -40
bind = NONE, Down, resizewin, +0, +40
bind = NONE, Escape, setkeymode, default
# Also bind Caps_Lock: with caps:swapescape active, the physical CapsLock
# key sends the Escape keysym logically, but Mango's bind matching may
# still key off the original Caps_Lock name for that physical key.
bind = NONE, Caps_Lock, setkeymode, default
bind = SUPER, r, setkeymode, default
keymode=default
